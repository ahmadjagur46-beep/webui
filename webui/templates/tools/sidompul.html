{% extends "base.html" %}
{% block content %}
<div class="neu-box p-4 md:p-6">
  <h2 class="text-xl font-bold mb-2">🔍 Sidompul Server Check</h2>
  <p class="text-xs text-slate-400 mb-4">Cek status koneksi dan informasi server Sidompul.</p>

  <form method="POST" class="grid gap-3 mb-4">
    <div>
      <label class="text-xs text-slate-400 mb-1 block">Nomor MSISDN / Dealer</label>
      <input type="text" name="msisdn" value="{{ msisdn or '' }}" placeholder="628xxxxxxxxxx" required class="w-full neu-input text-sm" style="padding:10px 14px;">
    </div>
    <button type="submit" class="btn btn-primary text-sm">🔍 Cek Status</button>
  </form>

  {% if output %}
  <div class="neu-box p-4">
    <pre class="text-xs text-emerald-300 whitespace-pre-wrap overflow-auto max-h-[500px]">{{ output }}</pre>
  </div>
  {% endif %}
</div>
{% endblock %}
