{% extends "base.html" %}
{% block content %}
<div class="neu-box p-4 md:p-6">
  <h2 class="text-xl font-bold mb-2">📝 Register Kartu (NIK/KK)</h2>
  <p class="text-xs text-slate-400 mb-4">Pendaftaran kartu menggunakan NIK dan KK.</p>

  <form method="POST" class="grid gap-3 mb-4">
    <div>
      <label class="text-xs text-slate-400 mb-1 block">NIK (Nomor Induk Kependudukan)</label>
      <input type="text" name="nik" value="{{ nik or '' }}" placeholder="16 digit NIK" required class="w-full neu-input text-sm" style="padding:10px 14px;">
    </div>
    <div>
      <label class="text-xs text-slate-400 mb-1 block">Nomor KK (Kartu Keluarga)</label>
      <input type="text" name="kk" value="{{ kk or '' }}" placeholder="16 digit KK" required class="w-full neu-input text-sm" style="padding:10px 14px;">
    </div>
    <button type="submit" class="btn btn-primary text-sm">📋 Daftarkan Kartu</button>
  </form>

  {% if output %}
  <div class="neu-box p-4">
    <pre class="text-xs text-emerald-300 whitespace-pre-wrap overflow-auto max-h-[500px]">{{ output }}</pre>
  </div>
  {% endif %}
</div>
{% endblock %}
